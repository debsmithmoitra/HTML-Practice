<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <!-- all your input fields go here -->
         <input type=""text"> <!-- type your name -->
         <input type="password"> <!-- character shown as dots -->
         <input type="date"> <!-- pick a date from the calendar -->
         <input type="radio"> <!-- choose only one option -->
         <input type="checkbox"> <!-- tick one or more options -->
         <input type="submit"> <!-- button to send the form -->
        
        <label>Your Name</label><br>
        <input type="text"><br><br>
        <button>Submit</button>

        <fieldset>
            <legend>Personal Details</legend>
            <label>Name</label><br>
            <input type="text"<br><br>
            <label>Date of Birth</label><br>
            <input type="date">
        </fieldset>

        <select id>
            <option value="">-- Select a doctor --</option>
            <option value="dr-ray">Dr. Ray - General</option>
            <option value="dr-lee">Dr. Lee - Teeth</option>
            <option value="dr-singh">Dr. Singh - Eyes</option>
        </select>

        <label>Any notes for the doctor?</label><br>
        <textarea rows="3" cols="35" placeholder="e.g. I have had a sore throat for 2 days.">
    </textarea>
    </form>
</body>
</html>
